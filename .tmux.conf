# C-t is prefix; use Vim-style copy selection.
unbind C-b
set -g prefix C-t
setw -g mode-keys vi
set -g history-limit 100000
set -g mouse on

# Prefer terminfo entries installed on this machine.
if-shell 'command -v infocmp >/dev/null 2>&1 && infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'if-shell "command -v infocmp >/dev/null 2>&1 && infocmp screen-256color >/dev/null 2>&1" "set -g default-terminal screen-256color" "set -g default-terminal screen"'

# Respect an executable login shell; otherwise keep tmux's valid default.
if-shell 'test -n "$SHELL" && test -x "$SHELL"' 'set -g default-shell "$SHELL"'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# System clipboard integration is optional. Headless sessions keep tmux's buffer.
if-shell 'test "$(uname -s)" = Darwin && command -v pbcopy >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy'
if-shell 'command -v wl-copy >/dev/null 2>&1 && test -n "$WAYLAND_DISPLAY" && { test -S "$WAYLAND_DISPLAY" || { test -n "$XDG_RUNTIME_DIR" && test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; }; }' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel wl-copy'
if-shell 'test -n "$DISPLAY" && command -v xclip >/dev/null 2>&1 && xclip -selection clipboard -o -target TARGETS >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"'

# Apply personal choices last. An explicit override never falls back to home.
# An existing tmux config owns its implicit overlay in coexistence mode.
if-shell 'test -n "$DOTFILES_TMUX_LOCAL"' 'source-file -q "$DOTFILES_TMUX_LOCAL"' 'if-shell -F "#{!=:#{@dotfiles_coexist},1}" "source-file -q ~/.tmux.conf.local"'
